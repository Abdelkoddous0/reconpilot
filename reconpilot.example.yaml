# Copy to reconpilot.yaml (or ~/.config/reconpilot/config.yaml) and edit.
data_dir: ./data

models:
  # Spec format: "<provider>:<model>"
  default: ollama:qwen2.5:14b
  profiles:
    triage: ollama:qwen2.5:14b            # used by `reconpilot triage`
    analyst: ollama:qwen2.5:14b           # used by `reconpilot ask`
    # analyst: anthropic:claude-opus-5-5  # needs allow_cloud=true on the project
    # analyst: codex-cli:default          # uses your Codex subscription
    # analyst: claude-cli:default         # uses your Claude Code subscription
  providers:
    # Add your own OpenAI-compatible server, e.g. vLLM on another port:
    vllm:
      type: openai_compat
      base_url: http://127.0.0.1:8000/v1
      local: true

analyst:
  max_steps: 20
  max_citation_retries: 2
  evidence_char_limit: 4000
  history_char_limit: 1500     # older tool results are shortened so long sessions fit small models

# Options for `rp run <tool>`. Every tool also accepts `timeout` (seconds).
tools:
  sherlock:
    request_timeout: 30        # per-site timeout
    local: false               # true = use sherlock's bundled site list instead of downloading it
  maigret:
    all_sites: false           # true = check every site, not the top 500
  theharvester:
    sources: crtsh,certspotter,hackertarget,otx,rapiddns,urlscan   # these need no API key
    limit: 500

# Extra folders with playbook YAML files (./playbooks and ~/.config/reconpilot/playbooks are always read).
playbook_dirs: []
