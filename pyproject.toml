[project]
name = "reconpilot"
version = "0.1.0"
description = "Local-first OSINT workbench with a bring-your-own-model AI analyst"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "dnspython>=2.6",
    "rich>=13.7",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
reconpilot = "reconpilot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reconpilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
