[project]
name = "reconpilot"
version = "0.1.0"
description = "Local-first OSINT workbench with a bring-your-own-model AI analyst"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "dnspython>=2.6",
    "rich>=13.7",
    "questionary>=2.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[project.scripts]
reconpilot = "reconpilot.cli:main"
rp = "reconpilot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reconpilot*"]

[tool.setuptools.package-data]
reconpilot = ["playbooks/*.yaml"]

# Third-party tool adapters register here, e.g. in your package's pyproject.toml:
# [project.entry-points."reconpilot.tools"]
# ghunt = "reconpilot_ghunt:GHunt"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP037"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
